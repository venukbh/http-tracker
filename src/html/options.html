<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>HTTP-TRACKER Preferences</title>
  <link rel="stylesheet" type="text/css" href="/src/css/styles.css" />
  <script type="text/javascript" src="/src/js/constants.js" defer></script>
  <script type="text/javascript" src="/src/js/utils.js" defer></script>
  <script type="text/javascript" src="/src/js/options.js" defer></script>
</head>

<body>
  <div id="persist_options" class="options_wrapper">
    <fieldset class="options_fieldset">
      <legend class="options_legend">Open addon window in (change takes effect on restart of addon window)</legend>
      <div class="options_radio_group">
        <label for="tab" class="options_radio_label" title="Open HTTP-TRACKER in a standard browser tab">
          <input type="radio" name="uipage" value="true" id="tab">
          <span>tab</span>
        </label>
        <label for="popup" class="options_radio_label" title="Open HTTP-TRACKER in a standalone popup window">
          <input type="radio" name="uipage" value="false" id="popup">
          <span>popup</span>
        </label>
      </div>
    </fieldset>
    <div class="options_row">
      <label for="default_include_patterns" class="options_label"
        title="Include URL patterns: Permanent list of comma-separated URL patterns to automatically track across sessions (e.g. google, api, checkout)">Include URL patterns</label>
      <textarea id="default_include_patterns" class="options_textarea" rows="4"
        title="Include URL patterns: Permanent list of comma-separated URL patterns to automatically track across sessions (e.g. google, api, checkout)"></textarea>
    </div>
    <div class="options_row">
      <label for="default_exclude_patterns" class="options_label"
        title="Exclude URL patterns: Permanent list of comma-separated URL patterns to automatically skip across sessions (e.g. analytics, cdn, static)">Exclude URL patterns</label>
      <textarea id="default_exclude_patterns" class="options_textarea" rows="4"
        title="Exclude URL patterns: Permanent list of comma-separated URL patterns to automatically skip across sessions (e.g. analytics, cdn, static)"></textarea>
    </div>
    <div class="options_row">
      <label for="default_mask_patterns" class="options_label"
        title="Mask patterns: Permanent list of comma-separated sensitive header or parameter names to automatically mask across sessions (e.g. authorization, password, token)">Mask patterns</label>
      <textarea id="default_mask_patterns" class="options_textarea" rows="4"
        title="Mask patterns: Permanent list of comma-separated sensitive header or parameter names to automatically mask across sessions (e.g. authorization, password, token)"></textarea>
    </div>
  </div>
</body>

</html>
